# nginx server block for pratenici.mk (static Astro build, behind Cloudflare).
#
# NOTE: production is on cPanel (Apache/LiteSpeed) — there the headers/caching are
# served by public/.htaccess, and this file is NOT used. Keep this only for a plain
# nginx server where you have root. Same headers, ported from the old netlify.toml.
#
# Install: copy to /etc/nginx/sites-available/pratenici.mk, symlink into
# sites-enabled/, then `nginx -t && systemctl reload nginx`.
# Adjust `root` and the TLS cert paths to match the server.

# www -> apex (Cloudflare can also do this, but keep it at the origin too).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pratenici.mk;

    ssl_certificate     /etc/ssl/cloudflare/pratenici.mk.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pratenici.mk.key;

    return 301 https://pratenici.mk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pratenici.mk;

    # Cloudflare Origin Certificate (see deploy/README.md). Use Full (Strict)
    # SSL mode in Cloudflare so the edge validates this cert.
    ssl_certificate     /etc/ssl/cloudflare/pratenici.mk.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pratenici.mk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The GitHub Actions workflow rsyncs the build here.
    root  /var/www/pratenici/dist;
    index index.html;

    # ---- Security headers (ported from netlify.toml) -----------------------
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security  "max-age=31536000" always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://cloudflareinsights.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # ---- Caching (ported from netlify.toml) --------------------------------
    # Content-hashed Astro assets are immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Data JSON is revalidated hourly.
    location /data/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # ---- Routing -----------------------------------------------------------
    # Astro builds directory-format pages (/questions/ -> /questions/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

# Optional: redirect plain HTTP to HTTPS at the origin. Cloudflare's
# "Always Use HTTPS" normally handles this before traffic reaches the server.
server {
    listen 80;
    listen [::]:80;
    server_name pratenici.mk www.pratenici.mk;
    return 301 https://pratenici.mk$request_uri;
}
