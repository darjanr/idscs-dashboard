name: Deploy

# Build the static site and rsync it to the origin server (behind Cloudflare)
# on every push to main. Mirrors the old Netlify "push = live" workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "FTP secrets not set yet — build succeeded, skipping deploy."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # FTPS (TLS-encrypted). cPanel's FTP cert usually won't match the IP, so
          # we skip cert validation — the transport stays encrypted either way.
          # mirror -R uploads dist/ to the web root; --delete prunes stale files,
          # but we keep .well-known and cgi-bin so AutoSSL/cPanel dirs survive.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 25;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' ftp://$FTP_SERVER;
            mirror --reverse --delete --parallel=4 --verbose \
              -x '\.well-known' -x 'cgi-bin' \
              dist/ ./ ;
          "

      - name: Purge Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ]; then
            curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' > /dev/null && echo "Cloudflare cache purged"
          else
            echo "Cloudflare secrets not set — skipping cache purge"
          fi
