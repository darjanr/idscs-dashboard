# Netlify config — used ONLY for the STAGING mirror of pratenici.mk.
# Production is the cPanel server (headers come from public/.htaccess). Netlify
# builds the `staging` branch for preview; every response here is marked noindex
# so this copy never competes with the real site in search.
# Static Astro build; no server, no secrets. Data is baked in at build time
# (public/data/*.json) and refreshed manually via the Python pipeline.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Security headers — applied to every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Keep this staging copy out of search results entirely.
    X-Robots-Tag = "noindex, nofollow"
    # Clickjacking protection
    X-Frame-Options = "DENY"
    # Block MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs to third parties (e.g. OSM tile servers)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Drop access to powerful browser features this dashboard never uses
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    # Force HTTPS for a year (no preload/includeSubDomains to keep handover safe)
    Strict-Transport-Security = "max-age=31536000"
    # Content Security Policy.
    #   script/style 'unsafe-inline': required by Astro's inline island-hydration
    #     bootstraps on a static host (no nonce server). External scripts are still
    #     blocked. Can be tightened to hashes later via Astro experimental CSP.
    #   img-src: MP photos + party logos are now self-hosted; only OSM map tiles
    #   remain external. blob:/data: cover canvas/PNG chart export.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://cloudflareinsights.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# Caching — content-hashed Astro assets are immutable; HTML/data revalidated
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images / fonts (logos, MP photos, favicons) — cache for 30 days
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
